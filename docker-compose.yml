# Local development database for the backend (docs/09, phase 2).
# Redis is not used in v1; see docs/kararlar.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: damla
      POSTGRES_USER: damla
      POSTGRES_PASSWORD: damla
    ports:
      - "5432:5432"
    volumes:
      - damla-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "damla"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  damla-db:
