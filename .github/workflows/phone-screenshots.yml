name: Phone screenshots

# Runs the phone app on an emulator against a backend with test data and keeps the screenshots: on demand,
# or when a branch under screenshots/ is pushed. The screenshots are committed back to that branch.
on:
  workflow_dispatch:
  push:
    branches: ['screenshots/**']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the debug app and the backend
        run: |
          ./gradlew -p android :app:assembleDebug
          ./gradlew :backend:installDist
          # The emulator needs the memory the Gradle daemons would keep.
          ./gradlew --stop
      - name: Start a backend with test data
        run: |
          DAMLA_SOURCES=test JAVA_OPTS=-Xmx512m nohup backend/build/install/backend/bin/backend > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/health && break; sleep 2; done
          curl -sf "http://localhost:8080/v1/snapshot?assets=usdtry" | head -c 300
          free -m
      - name: Record the machine's memory every 10 s
        run: |
          mkdir -p screenshots
          (while true; do echo "$(date +%T) $(free -m | sed -n 2p)"; sleep 10; done) > screenshots/memory.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Whatever happens on the emulator, the screenshots taken so far are kept after 15 minutes.
          script: timeout 900 bash scripts/phone-screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk screenshots/phone
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: phone-screenshots
          path: |
            screenshots
            backend.log
      - name: Commit the screenshots to this branch
        if: always() && startsWith(github.ref, 'refs/heads/screenshots/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Add phone screenshots" || exit 0
          git push
