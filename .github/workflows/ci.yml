name: CI

on:
  push:
    # Screenshot and sample branches only carry pictures (phone-screenshots.yml) and responses (source-samples.yml).
    branches-ignore: ['screenshots/**', 'samples/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Format, engine, backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: damla_test
          POSTGRES_USER: damla
          POSTGRES_PASSWORD: damla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damla"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DAMLA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/damla_test?user=damla&password=damla
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, verify coverage
        run: ./gradlew build koverVerify
      - name: The JavaScript gauge draws like the JVM one
        run: |
          ./gradlew :gauge:renderReference :gauge-js:jsProductionLibraryCompileSync
          node tools/gauge-reference/compare-js.mjs gauge-js/build/compileSync/js/main/productionLibrary/kotlin tools/gauge-reference/render-cases.json gauge/build/reference-render

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        run: ./gradlew -p android assembleDebug

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Gauge as JavaScript
        working-directory: desktop
        run: npm run gauge
      - name: Build the app (no installer)
        working-directory: desktop
        run: npx tauri build --no-bundle
