name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Format, engine, backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: damla_test
          POSTGRES_USER: damla
          POSTGRES_PASSWORD: damla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damla"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DAMLA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/damla_test?user=damla&password=damla
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, verify coverage
        run: ./gradlew build koverVerify

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        run: ./gradlew -p android assembleDebug
